<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Web App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full text-center">
        <h1 class="text-4xl font-bold text-gray-800 mb-6">Welcome to My App!</h1>
        <p class="text-gray-600 mb-8">Click the button below to fetch a message from the backend.</p>

        <button id="fetchButton" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-75">
            Fetch Message
        </button>

        <div id="messageDisplay" class="mt-8 p-4 bg-gray-50 border border-gray-200 rounded-lg text-gray-700 text-lg">
            No message yet.
        </div>
    </div>

    <script>
        // IMPORTANT: Replace this with your actual API Gateway URL
        // Example: const API_GATEWAY_URL = 'https://abcdef123.execute-api.us-east-1.amazonaws.com/prod/hello';
        const API_GATEWAY_URL = 'YOUR_API_GATEWAY_URL_HERE/hello'; // Placeholder for your API Gateway endpoint

        document.getElementById('fetchButton').addEventListener('click', async () => {
            const messageDisplay = document.getElementById('messageDisplay');
            messageDisplay.textContent = 'Fetching...';
            messageDisplay.classList.remove('bg-gray-50', 'bg-green-100', 'bg-red-100');
            messageDisplay.classList.add('bg-yellow-100'); // Indicate loading

            try {
                const response = await fetch(API_GATEWAY_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();
                messageDisplay.textContent = `Message: "${data.message}"`;
                messageDisplay.classList.remove('bg-yellow-100', 'bg-red-100');
                messageDisplay.classList.add('bg-green-100'); // Indicate success
            } catch (error) {
                console.error('Error fetching message:', error);
                messageDisplay.textContent = `Error: ${error.message}. Check console for details.`;
                messageDisplay.classList.remove('bg-yellow-100', 'bg-green-100');
                messageDisplay.classList.add('bg-red-100'); // Indicate error
            }
        });
    </script>
</body>
</html>
